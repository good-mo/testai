# Alembic 迁移配置（Phase D · schema 基线）
#
# 用法:
#   alembic upgrade head          # 应用到最新
#   alembic revision -m "desc"    # 新建迁移
#   alembic history               # 查看历史
#
# 注意: 本项目采用原生 SQLite（无 SQLAlchemy ORM），
#       迁移文件以 op.execute(raw_sql) 方式编写。

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 由 alembic/env.py 动态生成（指向项目根目录 tga.db）
sqlalchemy.url =

# 日志
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
