# Ruff 配置：项目此前完全没有 lint 配置（只有 requirements-dev 里的
# coverage/pytest），大量 except: pass / 未使用导入 / SQL 拼接风险无法被拦住。
# 这里以「低噪音、可立即通过」为原则启用基础规则集，后续可逐步收紧。

line-length = 100
target-version = "py311"

# 与 .gitignore 保持一致，避免扫描噪声
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "frontend",
    "uploads",
    "output",
    "*.db",
]

[lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes：未使用导入/变量、未定义名
    "I",    # isort：导入顺序
    "B",    # flake8-bugbear：常见 bug 模式
    "W",    # pycodestyle 警告
]

# 这些规则在当前代码库噪声过大，先不启用，避免一次性产生上千条告警
ignore = [
    "E501",   # 行长度：历史代码大量长行，交由 line-length 逐步治理
    "B008",   # 函数调用作为默认参数（FastAPI Depends 惯用法）
    "B904",   # raise 不带 from
    "E402",   # 模块级导入不在文件顶部（路由文件普遍如此）
]

# 每个文件允许的最大复杂度，超限才告警
[lint.mccabe]
max-complexity = 15
