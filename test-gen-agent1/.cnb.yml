main:
  push:
    # ─── 镜像构建：仅在镜像内容相关文件变更时执行 ───
    # 冻结用量 = ceil(时长/5min) × 核数：只跑 20s 也按 5min 全额冻结，
    # 8 核即 0.67 核时/次。9 月至今 379 次 push 累计冻结约 947 核时，
    # 而组织「云原生构建-CPU」月免费额度仅 160 核时 —— 额度早已见顶，
    # 此后所有构建（含本 PR 流水线）都在 Prepare 阶段被预冻结拦截。
    # 按最近 200 个 commit 统计，约 43% 的 push 未触及 Dockerfile 的 COPY
    # 内容（app/、frontend/、requirements.txt、scripts/）—— 这类 push 构建出的
    # 镜像与上一版字节级相同，纯属空烧。用 ifModify 收敛到真正影响镜像的路径。
    # 三条镜像流水线共用同一份 ifModify，总是同跳同跑，不会出现
    # await 空等（且平台死锁检测会兜底抛 dead lock found.）。
    - runner:
        tags: cnb:arch:amd64
        # 默认 8 核；本流水线是串行静态检查 + docker build，2 核足够，
        # 冻结单价从 0.67 核时/次降到 0.17 核时/次。
        cpus: 2
      ifModify:
        - Dockerfile
        - requirements.txt
        - app/**
        - frontend/**
        - scripts/**
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: route conflict check
          script: |
            # 该 runner 未挂载镜像、宿主环境无 python3，改用 python 容器执行
            docker run --rm -v "$PWD":/work -w /work python:3.12 python3 scripts/route_conflict_check.py --check
        - name: frontend contract check
          script: |
            docker run --rm -v "$PWD":/work -w /work python:3.12 python3 scripts/frontend_contract_check.py --check
        - name: docker build
          script: docker build -t ${IMAGE_TAG} .
        - name: docker push
          script: docker push ${IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-amd64 
          
    - runner:
        tags: cnb:arch:arm64:v8
        cpus: 2
      ifModify:
        - Dockerfile
        - requirements.txt
        - app/**
        - frontend/**
        - scripts/**
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
      stages:
        - name: docker login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          script: docker build -t ${IMAGE_TAG} .
        - name: docker push
          script: docker push ${IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-arm64

    - runner:
        cpus: 1
      ifModify:
        - Dockerfile
        - requirements.txt
        - app/**
        - frontend/**
        - scripts/**
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: await the amd64
          type: cnb:await
          options:
            key: build-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: build-arm64
        - name: manifest
          image: cnbcool/manifest
          settings:
            target: ${IMAGE_TAG}
            template: ${IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: remove tag
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker

    # 知识库：纯 IO + 网络任务，1 核即可（8 核纯属浪费 8 倍额度）。
    # 不按文件变更跳过：该任务同时承担 issueSyncEnabled 的 Issue 同步，
    # 用 ifModify 过滤会连带降低 Issue 同步频率，得不偿失。
    - runner:
        cpus: 1
      stages:
        - name: build knowledge base
          type: knowledge:update
          options:
            include: "**/**.md"
            exclude:
              - ".git/**"
              - "node_modules/**"
              - "frontend/node_modules/**"
            issueSyncEnabled: true
            chunkSize: 1500
            ignoreProcessFailures: false

$:
  pull_request:
    - runner:
        # 组织云原生构建-CPU 额度（160 核时/月）已耗尽，预冻结阶段就会因
        # 额度不足直接终止。冻结用量 = 5min × 核数，核数越少越省额度：
        #   8 核 → 0.67 核时/次（已不可用）
        #   2 核 → 0.17 核时/次（仍不可用）
        #   1 核 → 0.08 核时/次
        # 本流水线为串行 pytest，实测峰值内存 <500MiB、单次约 60s，
        # 1 核 2G 完全够用（2 核仅用于加速，非必需）。
        cpus: 1
      # 仅代码/配置变更时触发全量测试：纯文档 PR（docs/、reports/、*.md 等）
      # 不跑 pytest，节省已受限的组织 CPU 配额。
      ifModify:
        - app/**
        - frontend/**
        - tests/**
        - scripts/**
        - Dockerfile
        - requirements*.txt
        - .cnb.yml
      docker:
        image: python:3.12
      stages:
        - name: 安装依赖
          script: |
            pip install -r requirements.txt -r requirements-dev.txt --quiet
            pip install ruff --quiet
        - name: 增量 lint 检查（只卡变更文件）
          script: |
            # PR 事件中 CNB_BRANCH 即目标分支
            python3 scripts/lint_diff.py --base origin/$CNB_BRANCH
        - name: 路由冲突检查
          script: |
            python3 scripts/route_conflict_check.py --check
        - name: 前端契约检查
          script: |
            python3 scripts/frontend_contract_check.py --check
        - name: 前端界面测试矩阵同步检查
          script: |
            python3 scripts/gen_frontend_matrix.py --check
        - name: 按钮级死链检查
          script: |
            # 接口层全绿不代表按钮点得动：按钮 → handler → api 函数这条链
            # 断任何一层，接口测试都看不见。这里从按钮反向回溯兜住。
            python3 scripts/button_matrix.py --check
        - name: 数据库合并冲突检查
          script: |
            python3 scripts/merge_databases.py --check
        - name: Schema Registry 漂移检查
          script: |
            python3 scripts/sync_schema_registry.py --check
        - name: 删库冷启动冒烟（P0 回归防线）
          script: |
            # 冷启动缺表是历史性 P0：测试一直跑在热库上，永远走不到建表分支，
            # 导致第一批请求 500（no such table）。此用例在空库（隔离临时库）
            # 上直接打各 Repository 无守卫方法，任何删库冷启动回归都会在此红。
            python3 -m pytest tests/test_cold_start_smoke.py --tb=short -q -p no:cacheprovider
        - name: 初始化种子数据
          script: |
            python3 scripts/seed_demo_data.py
            python3 scripts/seed_defects.py
            python3 scripts/seed_all_data.py
        - name: 前端冒烟测试
          script: |
            python3 -m pytest tests/test_frontend_*.py --tb=short -q -p no:cacheprovider
        - name: 运行全量测试
          script: |
            # 分支覆盖率采集（--cov-branch）会让耗时翻倍（实测 60s → 110s），
            # 在额度耗尽期间先按行覆盖率采集，把单次核时压到最低。
            python3 -m pytest tests/ --tb=short -q -p no:cacheprovider --cov=app --cov-report=lcov --cov-report=term-missing
        - name: 上报测试覆盖率（质量门槛）
          script: |
            # 未加 --cov-branch 时无分支数据，脚本走「未采集 → 跳过分支红线」分支，
            # 此处仅卡行覆盖率 40%（实测 63%，余量充足）
            python3 scripts/report_coverage.py coverage.lcov 40 0
        - name: 空壳路由报告（告警：空壳超基线即红）
          script: |
            # 增量保护：存量空壳路由（假成功占位）见 reports/stub_routes.md。
            # 超过基线说明新增了占位/未接真实 Service 的路由，应改为真实实现
            # 或显式返回 stub() 标识（见 app/core/response.py）。
            python3 scripts/stub_route_report.py --check
        - name: AI 代码评审
          type: npc:go
          # AI 评审是「增强」而非「质量门禁」：模型侧不可用（如 2026-09-04
          # deepseek-v4-flash 全量 400 invalid_request_error）时不应让整条
          # PR 流水线变红——pytest / 覆盖率 / 契约检查才是真正的红线。
          #   allowFailure: 评审失败只标黄，不中断流水线
          #   retry: 1      覆盖模型侧偶发抖动（如限流、瞬时 5xx）
          allowFailure: true
          retry: 1
          options:
            role: 代码审查员
            systemPrompt: |
              你是一位严谨的代码审查专家，擅长发现代码中的质量问题、安全隐患和改进空间。
              请基于项目规范和 .codebuddy/skills/project-code-review 的审查标准，
              审查本次 PR 的代码变更。
            userPrompt: |
              请审查本次 PR 的代码变更，重点关注：
              1. 安全漏洞（SQL注入、认证绕过、敏感信息泄露）
              2. API 契约一致性（路由、参数、响应格式）
              3. 代码质量（重复代码、复杂度、异常处理）
              4. 性能问题（N+1查询、资源泄漏）
              请输出结构化的审查报告。
      failStages:
        - name: 构建失败提醒
          script: |
            echo "流水线执行失败，已触发 NPC 自动介入排查，请关注构建日志。"
            echo "失败构建 ID: $CNB_BUILD_ID"
            echo "失败信息: $CNB_BUILD_FAILED_MSG"

    # ─── P0 核心冒烟 E2E（真实浏览器）独立 pipeline ───
    # 说明：
    #   - 镜像自带 node+npm+chromium+python3，可一次跑通「前端构建→seed→起后端→Playwright 冒烟」
    #   - 相对上方串行 pytest 较重（数分钟），用 ifModify 仅在 E2E/前端相关文件变更时触发，
    #     后端纯逻辑改动可跳过，避免占用已受限的构建额度
    #   - 本地与 CI 复用同一入口 ./scripts/e2e.sh
    #   - playwright workers=1（串行执行），实测单 worker 浏览器不需要 8 核；
    #     前端 vite build 与 npm 在 2 核下足够，降核以节省组织 CPU 配额
    #     （8核→0.67 核时/次，2核→0.17 核时/次，降低 75% 额度消耗）
    - name: p0-smoke-e2e
      runner:
        cpus: 2
      docker:
        image: mcr.microsoft.com/playwright:v1.62.1-jammy
      ifModify:
        - frontend/src/**
        - frontend/package.json
        - frontend/config/**
        - frontend/.env.production
        - tests/e2e/**
        - scripts/e2e.sh
        - .cnb.yml
      stages:
        - name: 运行 P0 核心冒烟 E2E
          script: |
            bash scripts/e2e.sh
  vscode:
    - docker:
        build:
          dockerfile: ./Dockerfile
          by:
            - Dockerfile
            - app
            - requirements.txt
            - scripts
            - frontend
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls -al
        - name: run tests
          script: |
            python3 -m pytest tests/ --tb=short -q
